name: migraine_tracker
description: "Migraine tracker with an attack-mode log, an automatic weather feed and an explainable daily risk level."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  cloud_functions: ^7.0.1
  drift: ^2.35.3
  firebase_app_check: ^0.5.1
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.2
  go_router: ^18.1.3
  health: ^13.3.2
  http: ^1.6.0
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  sensors_plus: ^7.1.1
  share_plus: ^13.3.1
  sqlite3: ^3.9.0
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  workmanager: ^0.10.10
dev_dependencies:
  alchemist: ^0.14.1
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  path_provider_platform_interface: ^2.1.3
  riverpod_lint: ^3.1.9
  very_good_analysis: ^11.0.0
# SQLite build selection for package:sqlite3 (hooks). sqlcipher gives an
# encrypted database at rest; see docs/adr/0003-database.md.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/

