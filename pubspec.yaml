name: migraine_tracker
description: "Migraine tracker with an attack-mode log, an automatic weather feed and an explainable daily risk level."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.3
  intl: ^0.20.3

dev_dependencies:
  build_runner: ^2.17.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  riverpod_lint: ^3.1.9
  very_good_analysis: ^11.0.0
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/

