name: pr

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventions:
    name: Branch name and commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Branch name
        run: tool/check_branch_name.sh "${{ github.head_ref }}"
      - name: Commit messages
        run: |
          set -euo pipefail
          for sha in $(git rev-list --no-merges origin/${{ github.base_ref }}..HEAD); do
            git log -1 --format=%B "$sha" > /tmp/msg.txt
            tool/check_commit_msg.sh /tmp/msg.txt
          done

  flutter:
    name: Format, analyze, lints, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read Flutter version
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --set-exit-if-changed lib test tool packages
      - name: Codegen is up to date
        run: |
          flutter gen-l10n
          if [ -f build.yaml ] || grep -q build_runner pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          fi
          git diff --exit-code -- lib packages || (echo "Generated code is stale; run codegen and commit." && exit 1)
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Copy lint
        run: dart run tool/copy_lint.dart
      - name: Pseudo-locale is up to date
        run: dart run tool/pseudo_arb.dart --check
      - name: Hard-coded string lint
        run: dart run tool/string_lint.dart
      - name: Tests
        run: flutter test --coverage
      - name: Backup certificate pinning against the live hosts
        run: flutter test --run-skipped --tags network test/network
      - name: Pure Dart packages
        run: |
          for pkg in packages/*/; do
            if [ -f "$pkg/pubspec.yaml" ]; then
              (cd "$pkg" && dart pub get && dart analyze --fatal-infos && dart test)
              if [ -x "$pkg/tool/check_coverage.sh" ]; then
                (cd "$pkg" && ./tool/check_coverage.sh)
              fi
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
      - name: Accessibility scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: build/a11y/report.md
          if-no-files-found: ignore

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    needs: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Read Flutter version
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug --flavor dev -t lib/main_dev.dart --dart-define-from-file=env/dev.json
      - name: Debug APK (download from the run's Artifacts to test on a phone)
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-dev-debug.apk
          retention-days: 14

  wear:
    name: Wear OS app
    runs-on: ubuntu-latest
    needs: flutter
    defaults:
      run:
        working-directory: wear
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Read Flutter version
        id: fvm
        working-directory: .
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Tests
        run: flutter test
      - name: Debug build
        run: flutter build apk --debug --flavor dev
      - name: Debug APK (download from the run's Artifacts to test on a watch)
        uses: actions/upload-artifact@v4
        with:
          name: wear-debug-apk
          path: wear/build/app/outputs/flutter-apk/app-dev-debug.apk
          retention-days: 14

  ios:
    name: iOS build (no signing)
    runs-on: macos-latest
    needs: flutter
    steps:
      - uses: actions/checkout@v4
      - name: Read Flutter version
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --debug --no-codesign -t lib/main_dev.dart --dart-define-from-file=env/dev.json

  watchos:
    name: watchOS app
    runs-on: macos-latest
    needs: flutter
    steps:
      - uses: actions/checkout@v4
      - name: Protocol tests (decode the Dart package's fixtures)
        run: swift test --package-path ios/RiskWatch/WatchProtocolKit
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the watch project
        run: xcodegen generate --spec ios/RiskWatch/project.yml
      - name: Build for the watchOS simulator
        run: >
          xcodebuild build
          -project ios/RiskWatch/RiskWatch.xcodeproj
          -scheme RiskWatch
          -destination 'generic/platform=watchOS Simulator'
          CODE_SIGNING_ALLOWED=NO

  functions:
    name: Cloud Functions lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip until functions/ exists
        id: check
        run: |
          if [ -f functions/package.json ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.run == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        if: steps.check.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache Firebase emulators
        if: steps.check.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}
      - if: steps.check.outputs.run == 'true'
        working-directory: functions
        run: |
          npm ci
          npm run lint
          npm run format
          npm run typecheck
          npm test
      - name: Security rules tests (Firestore and Storage emulators)
        if: steps.check.outputs.run == 'true'
        working-directory: functions
        run: npx -y firebase-tools@15 emulators:exec --only firestore,storage --project migraine-tracker-rules-test "npx jest --config jest.rules.config.js"
